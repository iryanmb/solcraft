<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Solcraft sun road</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap">
<style>
body{margin:0}
a{color:#FFC23A}a:hover{color:#FFD873}
button:focus-visible,a:focus-visible{outline:3px solid #FFD873;outline-offset:2px}
@keyframes roadPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,194,58,0.55)}50%{box-shadow:0 0 0 12px rgba(255,194,58,0)}}
.road-pulse{animation:roadPulse 2.2s ease-in-out infinite}
@keyframes youGlow{0%,100%{filter:drop-shadow(0 0 6px rgba(255,194,58,0.6))}50%{filter:drop-shadow(0 0 16px rgba(255,194,58,0.95))}}
.road-you{animation:youGlow 2.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.road-pulse,.road-you{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1024; color: #F5F0E6; font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 46px 18px 12px; display: flex; flex-direction: column; gap: 8px">
<a href="Sky.dc.html" style="align-self: flex-start; display: flex; align-items: center; gap: 6px; padding: 6px 0; font-size: 15px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Your Sky</a>
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; align-items: center; gap: 10px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1">Sun Road</h1>
<button type="button" aria-label="How the Sun Road works" onClick="{{ openHelp }}" style="width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid #3A3F6E; background: transparent; color: #B3B0C7; font: 700 16px 'DM Sans', sans-serif; cursor: pointer">?</button>
</div>
<span aria-label="4 suns" style="display: flex; align-items: center; gap: 6px"><svg viewBox="0 0 100 100" width="26" height="26" aria-hidden="true"><polygon points="50.0,3.9 57.6,21.7 73.9,8.6 70.4,29.6 90.9,26.4 79.3,42.2 94.8,50.0 80.0,58.0 88.7,72.3 71.7,71.7 72.4,88.8 57.5,78.0 50.0,96.6 41.6,81.5 27.4,89.1 29.1,70.9 8.7,73.8 17.9,58.6 2.6,50.0 20.6,42.1 7.2,25.3 29.7,29.7 25.6,7.7 42.2,21.1" fill="#FFC23A" stroke="#1A1410" stroke-width="5" stroke-linejoin="round"></polygon></svg><strong style="color: #FFC23A; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px">4</strong></span>
</div>
</div>
<div style="position: relative; flex: 1; margin: 0 10px 12px; border-radius: 24px; background: #121530; overflow: hidden; isolation: isolate">
<div ref="{{ roadRef }}" style="position: absolute; inset: 0; z-index: 0; overflow-y: auto; overflow-x: hidden">
<div style="position: relative; width: 370px; height: {{ roadH }}px">
<svg width="370" height="{{ roadH }}" viewBox="0 0 370 {{ roadH }}" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<path d="{{ fullPath }}" fill="none" stroke="#1E2244" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="{{ donePath }}" fill="none" stroke="#FFC23A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"></path>
<sc-for list="{{ ahead }}" as="t" hint-placeholder-count="20">
<circle cx="{{ t.x }}" cy="{{ t.y }}" r="2.6" fill="#3A3F6E"></circle>
</sc-for>
<sc-for list="{{ links }}" as="k" hint-placeholder-count="5">
<line x1="{{ k.x1 }}" y1="{{ k.y }}" x2="{{ k.x2 }}" y2="{{ k.y }}" stroke="{{ k.color }}" stroke-width="2" stroke-dasharray="3 5"></line>
</sc-for>
</svg>
<sc-for list="{{ dots }}" as="d" hint-placeholder-count="3">
<button type="button" aria-label="{{ d.aria }}" onClick="{{ d.toggle }}" style="{{ d.style }}"><span style="width: 12px; height: 12px; border-radius: 6px; background: #1A1410; border: 3px solid #FFF6DA; box-sizing: border-box"></span></button>
</sc-for>
<button type="button" class="road-you" aria-label="You: sun 4, Community Jam" onClick="{{ you.toggle }}" style="{{ you.style }}">
<svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true"><polygon points="50.0,3.9 57.6,21.7 73.9,8.6 70.4,29.6 90.9,26.4 79.3,42.2 94.8,50.0 80.0,58.0 88.7,72.3 71.7,71.7 72.4,88.8 57.5,78.0 50.0,96.6 41.6,81.5 27.4,89.1 29.1,70.9 8.7,73.8 17.9,58.6 2.6,50.0 20.6,42.1 7.2,25.3 29.7,29.7 25.6,7.7 42.2,21.1" fill="#FFC23A" stroke="#1A1410" stroke-width="5" stroke-linejoin="round"></polygon><circle cx="42" cy="44" r="3.5" fill="#1A1410"></circle><circle cx="58" cy="44" r="3.5" fill="#1A1410"></circle><path d="M38 55 Q50 66 62 55" fill="none" stroke="#1A1410" stroke-width="4" stroke-linecap="round"></path></svg>
</button>
<sc-for list="{{ badges }}" as="b" hint-placeholder-count="5">
<button type="button" class="{{ b.cls }}" aria-label="{{ b.aria }}" onClick="{{ b.toggle }}" style="{{ b.style }}">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{ b.ink }}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ b.icon }}"></path></svg>
</button>
<span style="{{ b.nameStyle }}">{{ b.name }}</span>
</sc-for>
<sc-if value="{{ tip.show }}" hint-placeholder-val="{{ false }}">
<div role="tooltip" style="{{ tip.style }}">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #FFC23A">{{ tip.kicker }}</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px; line-height: 1.2">{{ tip.title }}</span>
<sc-for list="{{ tip.lines }}" as="l" hint-placeholder-count="2">
<span style="font-size: 13px; line-height: 1.4; color: #CFCBE0">{{ l }}</span>
</sc-for>
</div>
</sc-if>
</div>
</div>
<button type="button" onClick="{{ jump }}" style="position: absolute; right: 12px; top: 12px; z-index: 5; height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid #3A3F6E; background: #121530; color: #F5F0E6; font: 500 13px 'DM Sans', sans-serif; cursor: pointer">Jump to me</button>
<sc-if value="{{ showCoach }}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; inset: 0; z-index: 50; background: rgba(9,10,24,0.82); display: flex; align-items: center; justify-content: center; padding: 16px">
<div role="dialog" aria-modal="true" aria-label="Sun Road tips" style="width: 100%; padding: 22px; border-radius: 22px; background: #F5F0E6; color: #1A1410; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 20px 50px rgba(0,0,0,0.5)">
<span style="font-size: 12px; font-weight: 700; color: #6E5A3A">{{ coachStep }}</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.15">{{ coachTitle }}</span>
<span style="font-size: 15px; line-height: 1.5">{{ coachBody }}</span>
<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px">
<button type="button" onClick="{{ skipCoach }}" style="height: 44px; padding: 0 6px; border: none; background: transparent; color: #6E5A3A; font: 500 15px 'DM Sans', sans-serif; cursor: pointer">Skip</button>
<div style="display: flex; gap: 8px">
<sc-if value="{{ canBack }}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{ backCoach }}" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1.5px solid #1A1410; background: transparent; color: #1A1410; font: 700 15px 'DM Sans', sans-serif; cursor: pointer">Back</button>
</sc-if>
<button type="button" onClick="{{ nextCoach }}" style="height: 44px; padding: 0 18px; border-radius: 22px; border: none; background: #1A1410; color: #FFC23A; font: 700 15px 'DM Sans', sans-serif; cursor: pointer">{{ coachCta }}</button>
</div>
</div>
</div>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const HAVE = 4, MAX = 50, STEP = 34, PADT = 80, PADB = 80, X0 = 110, AMP = 30, BADGE = 52, BX = 92, W = 370;
const roadH = PADT + (MAX - 1) * STEP + PADB;
const Y = (n) => PADT + (MAX - n) * STEP;
const X = (n) => X0 + AMP * Math.sin((n - 1) * 0.3);
const pathTo = (a, b) => {
let d = '';
for (let t = a; t <= b + 0.0001; t += 0.25) d += (d ? ' L ' : 'M ') + X(t).toFixed(1) + ' ' + Y(t).toFixed(1);
return d;
};
const tail = 'M ' + X(1).toFixed(1) + ' ' + (Y(1) + 60) + ' L ';
const fullPath = tail + pathTo(1, MAX).slice(2);
const donePath = tail + pathTo(1, HAVE).slice(2);
const places = {
1: ['Cliterati Open Mic', 'Charis Books & More', 'Aug 20'],
2: ['Wednesday Jazz Jam', 'Red Light Café', 'Sep 16'],
3: ['Friday Jazz', 'High Museum of Art', 'Sep 18'],
4: ['Community Jam', "Dad's Garage", 'Oct 6']
};
const icons = {
first: 'M12 3 L13.8 10.2 L21 12 L13.8 13.8 L12 21 L10.2 13.8 L3 12 L10.2 10.2 Z',
dawn: 'M3 17 H21 M7 17 A5 5 0 0 1 17 17 M12 6 V8 M5.6 9.6 L7 11 M18.4 9.6 L17 11',
radiant: 'M12 9 A3 3 0 1 1 12 15 A3 3 0 1 1 12 9 Z M12 2 V5 M12 19 V22 M2 12 H5 M19 12 H22 M4.9 4.9 L7 7 M17 17 L19.1 19.1 M4.9 19.1 L7 17 M17 7 L19.1 4.9',
zenith: 'M3 20 Q12 0 21 20 M12 7 A2.5 2.5 0 1 1 12 12 A2.5 2.5 0 1 1 12 7 Z',
galaxy: 'M12 12 m-1 0 a1 1 0 1 1 2 0 a2.5 2.5 0 1 1 -4 1.5 a4.5 4.5 0 1 1 7.5 -3.5 a6.5 6.5 0 1 1 -10.5 6'
};
const marks = [
{ n: 1, name: 'First Light', icon: icons.first, line: 'Your first sun.' },
{ n: 5, name: 'Dawn', icon: icons.dawn, line: 'Challenge: bring a friend to their first sun.', status: 'Done' },
{ n: 10, name: 'Radiant', icon: icons.radiant, line: 'Challenge: suns in 3 different art forms.', status: 'Done' },
{ n: 25, name: 'Zenith', icon: icons.zenith, line: 'Challenge: go back to one place 5 times.', status: '4 of 5' },
{ n: 50, name: 'Galaxy', icon: icons.galaxy, line: 'Challenge: bring 3 friends to their first suns.', status: '1 of 3' }
];
const markAt = {};
marks.forEach((m) => { markAt[m.n] = m; });
const next = marks.find((m) => m.n > HAVE).n;
const hover = s.hover;
const ahead = [];
for (let n = HAVE + 1; n <= MAX; n++) if (!markAt[n]) ahead.push({ x: X(n).toFixed(1), y: Y(n).toFixed(1) });
const tog = (key) => ({ toggle: () => this.setState({ hover: hover === key ? null : key }) });
const dots = [];
for (let n = 1; n < HAVE; n++) {
dots.push({ aria: 'Sun ' + n + ': ' + places[n][0], style: 'position: absolute; left: ' + (X(n) - 16) + 'px; top: ' + (Y(n) - 16) + 'px; width: 32px; height: 32px; padding: 0; border: none; border-radius: 16px; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2;', ...tog('sun' + n) });
}
const youSize = 44;
const you = { style: 'position: absolute; left: ' + (X(HAVE) - youSize / 2) + 'px; top: ' + (Y(HAVE) - youSize / 2) + 'px; width: ' + youSize + 'px; height: ' + youSize + 'px; padding: 0; border: none; background: transparent; cursor: pointer; z-index: 3;', ...tog('sun' + HAVE) };
const links = [];
const badges = marks.map((m) => {
const reached = m.n <= HAVE;
const isNext = m.n === next;
const bx = X(m.n) + BX;
const by = Y(m.n);
links.push({ x1: (X(m.n) + 10).toFixed(1), x2: (bx - BADGE / 2).toFixed(1), y: by.toFixed(1), color: reached || isNext ? '#FFC23A' : '#2C3060' });
let style = 'position: absolute; left: ' + (bx - BADGE / 2) + 'px; top: ' + (by - BADGE / 2) + 'px; width: ' + BADGE + 'px; height: ' + BADGE + 'px; border-radius: 50%; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; box-sizing: border-box; z-index: 2;';
if (reached) style += ' background: #FFC23A; border: 3px solid #FFF6DA;';
else if (isNext) style += ' background: #2A211B; border: 3px solid #FFC23A;';
else style += ' background: #181B36; border: 2px solid #2C3060;';
return {
name: m.name, icon: m.icon,
ink: reached ? '#1A1410' : (isNext ? '#FFC23A' : '#5E5B7A'),
cls: isNext ? 'road-pulse' : '',
aria: m.name + ' badge, sun ' + m.n + (reached ? ', earned' : ''),
style,
nameStyle: 'position: absolute; left: ' + (bx + BADGE / 2 + 10) + 'px; top: ' + (by - 11) + 'px; font-family: \'Bricolage Grotesque\', sans-serif; font-weight: 800; font-size: 18px; pointer-events: none; white-space: nowrap; color: ' + (reached || isNext ? '#FFD873' : '#5E5B7A') + ';',
...tog('mark' + m.n)
};
});
const clampLeft = (x, w) => Math.min(Math.max(8, x - w / 2), W - w - 8);
let tip = { show: false, lines: [] };
if (hover && hover.indexOf('sun') === 0) {
const n = Number(hover.slice(3));
const p = places[n];
tip = { show: true, kicker: 'SUN ' + n + ' · ' + p[2].toUpperCase(), title: p[0], lines: [p[1]], style: 'position: absolute; left: ' + clampLeft(X(n), 220) + 'px; top: ' + (Y(n) + 22) + 'px; width: 220px;' };
} else if (hover && hover.indexOf('mark') === 0) {
const n = Number(hover.slice(4));
const m = markAt[n];
const lines = [m.line];
if (m.status) lines.push(m.status === 'Done' ? 'Challenge done' : 'Progress: ' + m.status);
lines.push(n <= HAVE ? 'Earned. It will show on your profile.' : 'Unlocks at sun ' + n + '.');
tip = { show: true, kicker: 'BADGE · SUN ' + n, title: m.name, lines, style: 'position: absolute; left: ' + clampLeft(X(n) + BX, 250) + 'px; top: ' + (Y(n) + BADGE / 2 + 8) + 'px; width: 250px;' };
}
if (tip.show) tip.style += ' padding: 12px 14px; border-radius: 16px; background: #22264A; border: 1.5px solid #3A3F6E; display: flex; flex-direction: column; gap: 4px; z-index: 10; box-shadow: 0 10px 26px rgba(0,0,0,0.45); box-sizing: border-box;';
const coach = s.coach === undefined ? 0 : s.coach;
const steps = [
['This glowing sun is you', 'You have 4 suns. Each one is a gathering you went to for the first time.'],
['Every new place you visit is a new sun', 'Keep unlocking new places to progress through the Sun Road.']
];
const ci = Math.min(Math.max(coach, 0), steps.length - 1);
const scrollToMe = (smooth) => {
const el = this._road;
if (el) el.scrollTo({ top: Math.max(0, Y(HAVE) - 380), behavior: smooth ? 'smooth' : 'auto' });
};
return {
roadH, fullPath, donePath, ahead, links, dots, you, badges, tip,
roadRef: (el) => { if (el && el !== this._road) { this._road = el; el.scrollTop = Math.max(0, Y(HAVE) - 380); } },
jump: () => scrollToMe(true),
showCoach: coach >= 0 && coach < steps.length,
coachStep: 'Tip ' + (ci + 1) + ' of ' + steps.length,
coachTitle: steps[ci][0],
coachBody: steps[ci][1],
canBack: ci > 0,
coachCta: ci >= steps.length - 1 ? 'Got it' : 'Next',
nextCoach: () => this.setState({ coach: ci >= steps.length - 1 ? -1 : ci + 1 }),
backCoach: () => this.setState({ coach: Math.max(0, ci - 1) }),
skipCoach: () => this.setState({ coach: -1 }),
openHelp: () => { this.setState({ coach: 0 }); scrollToMe(true); }
};
}
}
</script>
</body>
</html>
