.comet-tail{animation:cometGlow 1.4s ease-in-out infinite}

};
const dim = sel !== null;
const op = (k) => (!dim ? 1 : (sel === k ? 1 : 0.25));
const o = { jazz: op('jazz'), friday: op('friday'), poetry: op('poetry'), improv: op('improv'), comet: op('comet'), leo: dim ? 0.15 : 0.45, music: (!dim || sel === 'jazz' || sel === 'friday') ? 1 : 0.2, musicLabel: (sel === 'jazz' || sel === 'friday') ? 1 : 0 };

['friday', 'Friday Jazz', 300, 90, 44],
['poetry', 'Cliterati Open Mic', 285, 300, 52],
['improv', 'Community Jam', 95, 370, 46],
['comet', 'Comet', 180, 288, 44]
];
const hits = spots.map(([k, label, x, y, size]) => ({
label,
pick: pick(k),
style: 'position: absolute; left: calc(12px + (100% - 24px) * ' + (x / 390) + '); top: calc(12px + (100% - 24px) * ' + (y / 440) + '); width: ' + size + 'px; height: ' + size + 'px; transform: translate(-50%, -50%); border-radius: 50%; border: ' + (sel === k ? '2px solid #FFC23A' : '2px solid transparent') + '; background: transparent; cursor: pointer; padding: 0;'
}));
const tabBase = "height: 40px; padding: 0 18px; border-radius: 18px; border: none; font: 500 14px 'DM Sans', sans-serif; cursor: pointer;";
const tabs = [['sky', 'Sky'], ['moons', 'Moons']].map(([k, label]) => ({
label,
selected: tab === k ? 'true' : 'false',
pick: () => this.setState({ tab: k }),
style: tabBase + (tab === k ? ' background: #FFC23A; color: #1A1410; font-weight: 700;' : ' background: transparent; color: #B3B0C7;')
}));
const orbit = [
['improv', 'Community Jam', 'Tue, Oct 13 · 8 PM'],
['jazz', 'Wednesday Jazz Jam', 'Wed, Oct 14 · 9 PM'],
['poetry', 'Cliterati Open Mic', 'Thu, Oct 15 · 7:30 PM'],
['friday', 'Friday Jazz', 'Fri, Oct 16 · 6 PM']
].map(([k, title, when]) => ({ title, when, pick: () => this.setState({ sel: k }) }));
const sunRaw = suns[sel] || suns.jazz;
const pBase = 'display: flex; justify-content: space-between; font-size: 14px; padding: 10px 12px; border-radius: 12px;';
const sun = {
...sunRaw,
hasNote: !!sunRaw.note,
hasNext: !!sunRaw.next,
planets: sunRaw.planets.map(([d, w]) => ({ d, w, style: pBase + (w === 'No moon' ? ' background: transparent; border: 1.5px dashed #3A3F6E; color: #B3B0C7;' : ' background: #22264A; color: #F5F0E6;') }))
};
const moons = [
{ d: 'Oct 7', w: 'Moved', title: 'Wednesday Jazz Jam', note: '“The trumpet solo in the second set. The whole room went quiet.”' },
{ d: 'Sep 23', w: 'Joyful', title: 'Wednesday Jazz Jam', note: '' },
{ d: 'Sep 17', w: 'Inspired', title: 'Cliterati Open Mic', note: '' },
{ d: 'Sep 16', w: 'Curious', title: 'Wednesday Jazz Jam', note: '' }
].map((m) => ({ ...m, hasNote: !!m.note }));
return {
tabs, hits, o, orbit, sun, moons,
isSky: tab === 'sky', isMoons: tab === 'moons',
showOrbit: sel === null,
showSun: sel !== null,
panelLabel: sel === null ? 'Back this week' : 'Selected sun',
clear: () => this.setState({ sel: null })
};
}
}
