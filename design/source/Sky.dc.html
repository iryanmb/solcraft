<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const tab = s.tab || 'sky';
const tabs = [['sky', 'Sky'], ['moons', 'Moons']].map(([k, label]) => ({
label, on: tab === k, pick: () => this.setState({ tab: k }),
style: 'height: 40px; border-radius: 18px; border: none; cursor: pointer; font: ' + (tab === k ? '700' : '500') + ' 14px \'DM Sans\', sans-serif; background: ' + (tab === k ? '#FFC23A' : 'transparent') + '; color: ' + (tab === k ? '#1A1410' : '#B3B0C7') + ';'
}));
const thumb = 'width: 60px; height: 60px; flex: none; border-radius: 14px; display: flex; align-items: flex-end; padding: 6px; box-sizing: border-box; font-size: 10px; font-weight: 700; color: #1A1410; background: ';
const entries = [
{ title: 'Moved', d: 'Oct 7', where: 'Wednesday Jazz Jam', line: '“The trumpet solo in the second set. The whole room went quiet.”', tint: '#9FB8E8' },
{ title: 'Joyful', d: 'Sep 23', where: 'Wednesday Jazz Jam', line: '' },
{ title: 'Inspired', d: 'Sep 17', where: 'Cliterati Open Mic', line: '', tint: '#E9C58A' },
{ title: 'Curious', d: 'Sep 16', where: 'Wednesday Jazz Jam', line: '' }
].map((e) => ({ ...e, hasPhoto: !!e.tint, noPhoto: !e.tint, hasLine: !!e.line, thumb: thumb + (e.tint || '#22264A') + ';' }));
return { tabs, entries, isSky: tab === 'sky', isJournal: tab === 'moons' };
}
}
</script>
