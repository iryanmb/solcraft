<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Solcraft add a glimmer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&amp;display=swap">
<style>
body{margin:0;background:#0E1024}
a{color:#FFC23A}a:hover{color:#FFD873}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #FFD873;outline-offset:2px}
input::placeholder{color:#8F8CA8}

</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #0E1024; color: #F5F0E6; font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; padding: 52px 24px 34px; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px">
<a href="Sky.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid #3A3F6E; color: #F5F0E6; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<span style="font-size: 15px; color: #B3B0C7">Today</span>
<span style="width: 44px"></span>
</div>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; line-height: 1.08">Add a glimmer</h1>
<button type="button" onClick="{{ choose }}" aria-label="{{ photoAria }}" style="{{ photoStyle }}">
<sc-if value="{{ noPhoto }}" hint-placeholder-val="{{ true }}"><span style="display: flex; flex-direction: column; align-items: center; gap: 10px; color: #B3B0C7; font-size: 15px"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-8 9"></path></svg>Choose a photo</span></sc-if>
<sc-if value="{{ hasPhoto }}" hint-placeholder-val="{{ false }}"><span style="display: flex; align-items: flex-end; justify-content: flex-start; width: 100%; height: 100%; padding: 14px; box-sizing: border-box; font-size: 13px; font-weight: 700; color: #1A1410">[Photo]</span></sc-if>
</button>
<label for="g-line" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">A line about it</label>
<input id="g-line" type="text" placeholder="What caught your eye?" style="height: 54px; border-radius: 14px; border: 1.5px solid #3A3F6E; background: #181B36; color: #F5F0E6; font: 400 17px 'DM Sans', sans-serif; padding: 0 16px; box-sizing: border-box; width: 100%; margin-top: 16px">
<button type="button" onClick="{{ placeTap }}" style="margin-top: 10px; display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 16px; border-radius: 14px; border: 1.5px solid #3A3F6E; background: transparent; color: {{ placeColor }}; font: 500 16px 'DM Sans', sans-serif; cursor: pointer; text-align: left"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>{{ placeLabel }}</button>
<div style="margin-top: 10px; display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 0 4px 0 16px">
<span id="g-share" style="flex: 1; font-size: 16px">Share with followers</span>
<button type="button" role="switch" aria-checked="{{ share }}" aria-labelledby="g-share" onClick="{{ flipShare }}" style="{{ track }}"><span style="{{ knob }}"></span></button>
</div>
<div style="flex: 1"></div>
<a href="Sky.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 27px; border: none; background: #FFC23A; color: #1A1410; font: 700 16px 'DM Sans', sans-serif; text-decoration: none; cursor: pointer; width: 100%;">Save glimmer</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const has = !!s.photo, share = !!s.share, place = !!s.place;
return {
noPhoto: !has, hasPhoto: has,
photoAria: has ? 'Change photo' : 'Choose a photo',
photoStyle: 'margin-top: 22px; width: 100%; height: 300px; border-radius: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; overflow: hidden; ' + (has ? 'border: none; background: #E9C58A;' : 'border: 2px dashed #3A3F6E; background: #121530;'),
choose: () => this.setState({ photo: true }),
placeLabel: place ? 'Charis Books & More' : 'Add a place',
placeColor: place ? '#F5F0E6' : '#B3B0C7',
placeTap: () => this.setState({ place: !place }),
share, flipShare: () => this.setState({ share: !share }),
track: 'flex: none; width: 52px; height: 32px; border-radius: 16px; border: none; padding: 3px; box-sizing: border-box; cursor: pointer; display: flex; justify-content: ' + (share ? 'flex-end' : 'flex-start') + '; background: ' + (share ? '#FFC23A' : '#3A3F6E') + ';',
knob: 'width: 26px; height: 26px; border-radius: 13px; background: ' + (share ? '#1A1410' : '#F5F0E6') + ';'
};
}
}
</script>
</body>
</html>
