<div style="padding: 18px; border-radius: 22px; background: #181B36; display: flex; flex-direction: column; gap: 10px">
<svg viewBox="0 0 140 70" width="100%" height="70" aria-hidden="true"><circle cx="70" cy="35" r="7" fill="#FFC23A"></circle><circle cx="110" cy="20" r="2" fill="#3A3F6E"></circle><circle cx="30" cy="50" r="2" fill="#3A3F6E"></circle></svg>

<script type="text/x-dc" data-dc-script data-props='{"viewer":{"editor":"enum","options":["You","A follower","Not following"],"default":"You"},"avatar":{"editor":"enum","options":["Sun icon","Photo"],"default":"Sun icon"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const viewer = this.props.viewer ?? 'You';
const isSelf = viewer === 'You';
const isFollower = viewer === 'A follower';
const followOn = s.follow !== undefined ? s.follow : isFollower;
const pins = s.pins || { jazz: true, poetry: true };
const art = { Words: '#FF8F6B', Music: '#7FB2FF', Comedy: '#9BE3B8' };
const raw = [
{ id: 'jazz', title: 'Wednesday Jazz Jam', venue: 'Red Light Café', form: 'Music', n: 4 },
{ id: 'poetry', title: 'Cliterati Open Mic', venue: 'Charis Books & More', form: 'Words', n: 2 },
{ id: 'friday', title: 'Friday Jazz', venue: 'High Museum of Art', form: 'Music', n: 1 },
{ id: 'improv', title: 'Community Jam', venue: "Dad's Garage", form: 'Comedy', n: 1 }
];
const pinCount = raw.filter((r) => pins[r.id]).length;
const ordered = raw.slice().sort((a, b) => (pins[b.id] ? 1 : 0) - (pins[a.id] ? 1 : 0) || b.n - a.n);
const places = ordered.map((r) => {
const pinned = !!pins[r.id];
const canPin = pinned || pinCount < 3;
return {
title: r.title, venue: r.venue, form: r.form,
planets: r.n === 1 ? '1 planet' : r.n + ' planets',
dotStyle: 'width: 10px; height: 10px; border-radius: 50%; background: ' + art[r.form] + ';',
cardStyle: 'padding: 18px; border-radius: 22px; background: #181B36; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box; border: 1.5px solid ' + (pinned ? '#5C4A1E' : '#181B36') + ';',
pinned, showPin: isSelf, showPinnedTag: !isSelf && pinned,
pinAria: pinned ? 'Unpin ' + r.title : 'Pin ' + r.title,
pinFill: pinned ? 'currentColor' : 'none',
pinStyle: 'flex: none; width: 36px; height: 36px; border-radius: 18px; border: 1.5px solid ' + (pinned ? '#FFC23A' : '#3A3F6E') + '; background: transparent; color: ' + (pinned ? '#FFC23A' : (canPin ? '#B3B0C7' : '#4A4766')) + '; cursor: ' + (canPin ? 'pointer' : 'not-allowed') + '; display: flex; align-items: center; justify-content: center;',
pin: () => { if (canPin) this.setState({ pins: Object.assign({}, pins, { [r.id]: !pinned }) }); }
};
});
const icons = {
first: 'M12 3 L13.8 10.2 L21 12 L13.8 13.8 L12 21 L10.2 13.8 L3 12 L10.2 10.2 Z',
dawn: 'M3 17 H21 M7 17 A5 5 0 0 1 17 17 M12 6 V8 M5.6 9.6 L7 11 M18.4 9.6 L17 11',
radiant: 'M12 9 A3 3 0 1 1 12 15 A3 3 0 1 1 12 9 Z M12 2 V5 M12 19 V22 M2 12 H5 M19 12 H22 M4.9 4.9 L7 7 M17 17 L19.1 19.1 M4.9 19.1 L7 17 M17 7 L19.1 4.9',
zenith: 'M3 20 Q12 0 21 20 M12 7 A2.5 2.5 0 1 1 12 12 A2.5 2.5 0 1 1 12 7 Z',
galaxy: 'M12 12 m-1 0 a1 1 0 1 1 2 0 a2.5 2.5 0 1 1 -4 1.5 a4.5 4.5 0 1 1 7.5 -3.5 a6.5 6.5 0 1 1 -10.5 6'
};
const list = [
{ name: 'First Light', icon: icons.first, state: 'earned', sub: 'Earned Aug 20' },
{ name: 'Dawn', icon: icons.dawn, state: 'earned', sub: 'Earned Sep 23' },
{ name: 'Radiant', icon: icons.radiant, state: 'next', sub: 'One night away' },
{ name: 'Zenith', icon: icons.zenith, state: 'locked', sub: 'Step 25' },
{ name: 'Galaxy', icon: icons.galaxy, state: 'locked', sub: 'Step 50' }
];
const badges = list.map((b) => {
const earned = b.state === 'earned', isNext = b.state === 'next';
let medal = 'width: 76px; height: 76px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-sizing: border-box;';
if (earned) medal += ' background: #FFC23A; border: 3px solid #FFF6DA; box-shadow: 0 0 22px rgba(255,194,58,0.45);';
else if (isNext) medal += ' background: #2A211B; border: 3px solid #FFC23A;';
else medal += ' background: #121530; border: 2px solid #2C3060;';
return {
name: b.name, icon: b.icon, medal, sub: b.sub,
ink: earned ? '#1A1410' : (isNext ? '#FFC23A' : '#5E5B7A'),
nameStyle: "font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 18px; color: " + (earned || isNext ? '#F5F0E6' : '#6E6B88') + ';'
};
});
const btn = 'height: 44px; padding: 0 20px; border-radius: 22px; font: 700 14px \'DM Sans\', sans-serif; cursor: pointer;';
const canSee = isSelf || (isFollower && followOn);
const photo = (this.props.avatar ?? 'Sun icon') === 'Photo';
return {
sunAvatar: !photo, photoAvatar: photo, showHandle: isSelf || canSee,
isSelf, isVisitor: !isSelf, canSeePlaces: canSee, locked: !canSee,
places, badges, followOn,
followLabel: isFollower ? (followOn ? 'Following' : 'Follow') : (followOn ? 'Requested' : 'Request to follow'),
followStyle: btn + (followOn ? ' border: 1.5px solid #3A3F6E; background: transparent; color: #F5F0E6;' : ' border: none; background: #FFC23A; color: #1A1410;'),
toggleFollow: () => this.setState({ follow: !followOn })
};
}
}
</script>
</body>
</html>
