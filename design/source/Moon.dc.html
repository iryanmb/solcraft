<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Solcraft leave a moon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap">
<style>
body{margin:0}
a{color:#FFC23A}a:hover{color:#FFD873}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1024; color: #F5F0E6; font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; padding: 60px 24px 36px; overflow: hidden">
<p style="margin: 0; font-size: 14px; color: #B3B0C7">Thursday morning</p>
<div style="margin-top: 18px; display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: 20px; background: #181B36">
<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="28" cy="34" r="16" fill="#7FB2FF"></circle><ellipse cx="28" cy="34" rx="26" ry="8" fill="none" stroke="#3A3F6E" stroke-width="2"></ellipse><circle cx="54" cy="12" r="6" fill="{{moonFill}}" stroke="#E9E4D6" stroke-width="2"></circle></svg>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #B3B0C7">Last night · your first planet</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 19px">Wednesday Jazz Jam</span>
</div>
</div>
<h1 style="margin: 34px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 36px; line-height: 1.05">Leave a moon?</h1>
<p style="margin: 10px 0 0; font-size: 16px; line-height: 1.45; color: #B3B0C7">One tap for how it felt. It stays private.</p>
<div style="margin-top: 22px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{words}}" as="w" hint-placeholder-count="6">
<button type="button" onClick="{{ w.pick }}" style="{{ w.style }}">{{ w.label }}</button>
</sc-for>
</div>
<sc-if value="{{ picked }}" hint-placeholder-val="{{ false }}">
<div style="margin-top: 22px; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 15px; font-weight: 700; color: #FFD873">Moon saved. Add a line?</p>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #B3B0C7">What stayed with you? (optional)<input type="text" placeholder="The trumpet solo in the second set…" style="height: 50px; border-radius: 14px; border: 1.5px solid #3A3F6E; background: #181B36; color: #F5F0E6; font: 400 16px 'DM Sans', sans-serif; padding: 0 14px; box-sizing: border-box"></label>
</div>
</sc-if>
<button type="button" onClick="{{ addPhoto }}" style="{{ photoStyle }}">
<sc-if value="{{ noPhoto }}" hint-placeholder-val="{{ true }}"><span style="width: 52px; height: 52px; flex: none; border-radius: 14px; border: 1.5px dashed #3A3F6E; display: flex; align-items: center; justify-content: center; color: #B3B0C7"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-8 9"></path></svg></span></sc-if>
<sc-if value="{{ hasPhoto }}" hint-placeholder-val="{{ false }}"><span style="width: 52px; height: 52px; flex: none; border-radius: 14px; background: #9FB8E8; display: flex; align-items: flex-end; padding: 5px; box-sizing: border-box; font-size: 9px; font-weight: 700; color: #1A1410">[Photo]</span></sc-if>
<span style="display: flex; flex-direction: column; gap: 2px; text-align: left"><span style="font-weight: 700; font-size: 15px">{{ photoTitle }}</span><span style="font-size: 13px; color: #B3B0C7">{{ photoSub }}</span></span>
</button>
<div style="flex: 1"></div>
<a href="Sky.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 27px; background: {{ ctaBg }}; color: {{ ctaColor }}; font: 700 16px 'DM Sans', sans-serif; text-decoration: none">{{ ctaLabel }}</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const gs = this.state || {};
const gHas = !!gs.photo;
const glim = {
noPhoto: !gHas, hasPhoto: gHas,
photoTitle: gHas ? 'Photo added' : 'Add a photo from last night',
photoSub: gHas ? 'Saved with this moon' : 'From your camera roll',
photoStyle: 'margin-top: 16px; display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 18px; border: none; cursor: pointer; color: #F5F0E6; font-family: \'DM Sans\', sans-serif; background: #181B36;',
addPhoto: () => this.setState({ photo: !gHas })
};
const picked = this.state && this.state.picked;
const labels = ['Moved', 'Joyful', 'Inspired', 'Calm', 'Curious', 'Not for me'];
const base = "height: 48px; border-radius: 16px; font: 500 15px 'DM Sans', sans-serif; cursor: pointer;";
const words = labels.map((label) => ({
label,
pick: () => this.setState({ picked: label }),
style: picked === label
? base + ' border: none; background: #E9E4D6; color: #1A1410; font-weight: 700;'
: base + ' border: 1.5px solid #3A3F6E; background: #181B36; color: #F5F0E6;'
}));
return Object.assign(glim, {
words,
picked: !!picked,
moonFill: picked ? '#E9E4D6' : 'transparent',
ctaLabel: picked ? 'See your sky' : 'Not now',
ctaBg: picked ? '#FFC23A' : 'transparent',
ctaColor: picked ? '#1A1410' : '#B3B0C7'
});
}
}
</script>
</body>
</html>
