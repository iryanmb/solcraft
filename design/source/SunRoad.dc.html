<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Solcraft sun road</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap">
<style>
body{margin:0;background:#0E1024}
a{color:#FFC23A}a:hover{color:#FFD873}
button:focus-visible,a:focus-visible{outline:3px solid #FFD873;outline-offset:3px}
@keyframes youGlow{0%,100%{filter:drop-shadow(0 0 5px rgba(255,194,58,0.5))}50%{filter:drop-shadow(0 0 12px rgba(255,194,58,0.85))}}
.road-you{animation:youGlow 2.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.road-you{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #0E1024; color: #F5F0E6; font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 44px 20px 10px; display: flex; flex-direction: column; gap: 6px">
<a href="Sky.dc.html" style="align-self: flex-start; display: flex; align-items: center; gap: 6px; padding: 6px 0; font-size: 15px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Your Sky</a>
<div style="display: flex; align-items: center; gap: 12px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1">Sun Road</h1>
<button type="button" aria-label="How the Sun Road works" onClick="{{ openHelp }}" style="width: 40px; height: 40px; border-radius: 20px; border: 1.5px solid #3A3F6E; background: transparent; color: #B3B0C7; font: 700 15px 'DM Sans', sans-serif; cursor: pointer">?</button>
<span style="margin-left: auto; display: flex; align-items: baseline; gap: 6px; font-size: 14px; color: #B3B0C7"><strong style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; color: #FFC23A; line-height: 1">{{ have }}</strong>nights</span>
</div>
</div>
<div ref="{{ roadRef }}" style="flex: 1; min-height: 0; overflow-y: auto; margin: 0 12px; border-radius: 24px; background: #121530">
<div style="position: relative; width: 100%; height: {{ roadH }}px">
<svg width="100%" height="{{ roadH }}" aria-hidden="true" style="position: absolute; left: 0; top: 0; overflow: visible">
<line x1="76" y1="{{ topY }}" x2="76" y2="{{ bottomY }}" stroke="#262A52" stroke-width="4" stroke-linecap="round"></line>
<line x1="76" y1="{{ youY }}" x2="76" y2="{{ bottomY }}" stroke="#FFC23A" stroke-width="4" stroke-linecap="round"></line>
<sc-for list="{{ ticks }}" as="t" hint-placeholder-count="40">
<circle cx="76" cy="{{ t.y }}" r="2" fill="{{ t.fill }}"></circle>
</sc-for>
<circle cx="76" cy="{{ youY }}" r="6" fill="#FFC23A" stroke="#121530" stroke-width="3"></circle>
</svg>
<sc-for list="{{ badges }}" as="b" hint-placeholder-count="5">
<button type="button" aria-label="{{ b.aria }}" aria-pressed="{{ b.selected }}" onClick="{{ b.pick }}" style="{{ b.nodeStyle }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{ b.ink }}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ b.icon }}"></path></svg></button>
<span style="{{ b.labelStyle }}"><span style="{{ b.nameStyle }}">{{ b.name }}</span><span style="font-size: 12px; color: #B3B0C7">{{ b.sub }}</span></span>
</sc-for>
<span class="road-you" aria-label="You, night {{ have }}" role="img" style="{{ youStyle }}"><svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true"><polygon points="50.0,3.9 57.6,21.7 73.9,8.6 70.4,29.6 90.9,26.4 79.3,42.2 94.8,50.0 80.0,58.0 88.7,72.3 71.7,71.7 72.4,88.8 57.5,78.0 50.0,96.6 41.6,81.5 27.4,89.1 29.1,70.9 8.7,73.8 17.9,58.6 2.6,50.0 20.6,42.1 7.2,25.3 29.7,29.7 25.6,7.7 42.2,21.1" fill="#FFC23A" stroke="#1A1410" stroke-width="5" stroke-linejoin="round"></polygon><circle cx="42" cy="44" r="3.5" fill="#1A1410"></circle><circle cx="58" cy="44" r="3.5" fill="#1A1410"></circle><path d="M38 55 Q50 66 62 55" fill="none" stroke="#1A1410" stroke-width="4" stroke-linecap="round"></path></svg></span>
</div>
</div>
<section aria-label="Selected badge" style="margin: 12px 12px 24px; padding: 18px; border-radius: 22px; background: #181B36; display: flex; flex-direction: column; gap: 14px">
<sc-if value="{{ showCoach }}" hint-placeholder-val="{{ true }}">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #FFD873">{{ coachStep }}</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.1">{{ coachTitle }}</span>
<span style="font-size: 16px; line-height: 1.5; color: #CFCBE0">{{ coachBody }}</span>
<div style="display: flex; align-items: center; gap: 8px; margin-top: 2px">
<button type="button" onClick="{{ skipCoach }}" style="height: 44px; padding: 0 6px; border: none; background: transparent; color: #B3B0C7; font: 500 15px 'DM Sans', sans-serif; cursor: pointer">Skip</button>
<span style="flex: 1"></span>
<sc-if value="{{ canBack }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ backCoach }}" style="height: 44px; padding: 0 18px; border-radius: 22px; border: 1.5px solid #3A3F6E; background: transparent; color: #F5F0E6; font: 700 15px 'DM Sans', sans-serif; cursor: pointer">Back</button></sc-if>
<button type="button" onClick="{{ nextCoach }}" style="height: 44px; padding: 0 20px; border-radius: 22px; border: none; background: #FFC23A; color: #1A1410; font: 700 15px 'DM Sans', sans-serif; cursor: pointer">{{ coachCta }}</button>
</div>
</sc-if>
<sc-if value="{{ noCoach }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 14px">
<span style="{{ sel.medal }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{ sel.ink }}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ sel.icon }}"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.05">{{ sel.name }}</span><span style="{{ sel.statusStyle }}">{{ sel.status }}</span></span>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #22264A">
<sc-if value="{{ sel.done }}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="11" fill="#FFC23A"></circle><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#1A1410" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
<sc-if value="{{ sel.open }}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="10" fill="none" stroke="#5E5B7A" stroke-width="2"></circle></svg></sc-if>
<span style="flex: 1; font-size: 15px; line-height: 1.35">{{ sel.challenge }}</span>
<span style="font-size: 14px; font-weight: 700; color: #FFD873; white-space: nowrap">{{ sel.progress }}</span>
</div>
</sc-if>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const MAX = 50, STEP = 11, PADT = 26, PADB = 26, X = 76, NODE = 40;
const HAVE = 9;
const roadH = PADT + (MAX - 1) * STEP + PADB;
const Y = (n) => PADT + (MAX - n) * STEP;
const icons = {
first: 'M12 3 L13.8 10.2 L21 12 L13.8 13.8 L12 21 L10.2 13.8 L3 12 L10.2 10.2 Z',
dawn: 'M3 17 H21 M7 17 A5 5 0 0 1 17 17 M12 6 V8 M5.6 9.6 L7 11 M18.4 9.6 L17 11',
radiant: 'M12 9 A3 3 0 1 1 12 15 A3 3 0 1 1 12 9 Z M12 2 V5 M12 19 V22 M2 12 H5 M19 12 H22 M4.9 4.9 L7 7 M17 17 L19.1 19.1 M4.9 19.1 L7 17 M17 7 L19.1 4.9',
zenith: 'M3 20 Q12 0 21 20 M12 7 A2.5 2.5 0 1 1 12 12 A2.5 2.5 0 1 1 12 7 Z',
galaxy: 'M12 12 m-1 0 a1 1 0 1 1 2 0 a2.5 2.5 0 1 1 -4 1.5 a4.5 4.5 0 1 1 7.5 -3.5 a6.5 6.5 0 1 1 -10.5 6'
};
const marks = [
{ n: 1, name: 'First Light', icon: icons.first, challenge: 'Your first night out', done: true, progress: '', earned: 'Aug 20' },
{ n: 5, name: 'Dawn', icon: icons.dawn, challenge: 'Come back to a place once', done: true, progress: '', earned: 'Sep 23' },
{ n: 10, name: 'Radiant', icon: icons.radiant, challenge: 'Suns in 3 art forms', done: true, progress: '' },
{ n: 25, name: 'Zenith', icon: icons.zenith, challenge: '5 nights at one place', done: false, progress: '4 of 5' },
{ n: 50, name: 'Galaxy', icon: icons.galaxy, challenge: 'Suns at 8 places', done: false, progress: '4 of 8' }
];
const isEarned = (m) => m.n <= HAVE && m.done;
const coachI = s.coach === undefined ? 0 : s.coach;
const next = marks.find((m) => !isEarned(m));
const selN = s.sel !== undefined ? s.sel : next.n;
const status = (m) => {
if (isEarned(m)) return 'Earned ' + m.earned;
if (m.n <= HAVE) return 'Finish the challenge to earn it';
const k = m.n - HAVE;
return k === 1 ? '1 night away' : k + ' nights away';
};
const isMark = {};
marks.forEach((m) => { isMark[m.n] = true; });
const ticks = [];
for (let n = 1; n <= MAX; n++) if (!isMark[n] && n !== HAVE) ticks.push({ y: Y(n), fill: n < HAVE ? '#FFE3A3' : '#3A3F6E' });
const badges = marks.map((m) => {
const earned = isEarned(m);
const isNext = m.n === next.n;
const selected = m.n === selN;
let node = 'position: absolute; left: ' + (X - NODE / 2) + 'px; top: ' + (Y(m.n) - NODE / 2) + 'px; width: ' + NODE + 'px; height: ' + NODE + 'px; border-radius: 50%; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; box-sizing: border-box; z-index: 2;';
if (earned) node += ' background: #FFC23A; border: none;';
else if (isNext) node += ' background: #0E1024; border: 2.5px solid #FFC23A;';
else node += ' background: #0E1024; border: 2px solid #3A3F6E;';
if (coachI === 1 ? isNext : (coachI < 0 && selected)) node += ' box-shadow: 0 0 0 4px #121530, 0 0 0 6px #F5F0E6;';
return {
name: m.name, icon: m.icon, selected,
ink: earned ? '#1A1410' : (isNext ? '#FFC23A' : '#6E6B88'),
aria: m.name + ', night ' + m.n + (earned ? ', earned' : ''),
nodeStyle: node,
labelStyle: 'position: absolute; left: ' + (X + NODE / 2 + 14) + 'px; top: ' + (Y(m.n) - 19) + 'px; display: flex; flex-direction: column; gap: 1px; pointer-events: none; white-space: nowrap;',
nameStyle: "font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px; color: " + (earned ? '#F5F0E6' : (isNext ? '#FFD873' : '#8F8CA8')) + ';',
sub: 'Night ' + m.n,
pick: () => this.setState({ sel: m.n })
};
});
const sm = marks.find((m) => m.n === selN);
const sEarned = isEarned(sm), sNext = sm.n === next.n;
let medal = 'width: 54px; height: 54px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-sizing: border-box;';
medal += sEarned ? ' background: #FFC23A;' : (sNext ? ' border: 2.5px solid #FFC23A;' : ' border: 2px solid #3A3F6E;');
const sel0 = 0;
const sel = {
name: sm.name, icon: sm.icon, medal, ink: sEarned ? '#1A1410' : (sNext ? '#FFC23A' : '#6E6B88'),
status: status(sm), statusStyle: 'font-size: 15px; font-weight: 700; color: ' + (sEarned ? '#B3B0C7' : '#FFD873') + ';',
challenge: sm.challenge, progress: sm.done ? '' : sm.progress, done: sm.done, open: !sm.done
};
const YOU = 30;
const coach = s.coach === undefined ? 0 : s.coach;
const steps = [
['This is you', 'Every night out moves you one step up the road.'],
['Badges light up along the way', 'Each one has a small challenge. Tap a badge to see it.']
];
const ci = Math.min(Math.max(coach, 0), steps.length - 1);
return {
roadH, have: HAVE, ticks, badges, sel,
topY: Y(MAX), bottomY: Y(1) + 16, youY: Y(HAVE),
youStyle: 'position: absolute; left: ' + (X - NODE / 2 - 12 - YOU) + 'px; top: ' + (Y(HAVE) - YOU / 2) + 'px; width: ' + YOU + 'px; height: ' + YOU + 'px; z-index: 3; display: block; border-radius: 50%;' + (coachI === 0 ? ' box-shadow: 0 0 0 5px #121530, 0 0 0 7px #F5F0E6;' : ''),
roadRef: (el) => { if (el && el !== this._road) { this._road = el; el.scrollTop = el.scrollHeight; } },
showCoach: coach >= 0 && coach < steps.length, noCoach: !(coach >= 0 && coach < steps.length),
coachStep: 'Tip ' + (ci + 1) + ' of ' + steps.length,
coachTitle: steps[ci][0],
coachBody: steps[ci][1],
canBack: ci > 0,
coachCta: ci >= steps.length - 1 ? 'Got it' : 'Next',
nextCoach: () => this.setState({ coach: ci >= steps.length - 1 ? -1 : ci + 1 }),
backCoach: () => this.setState({ coach: Math.max(0, ci - 1) }),
skipCoach: () => this.setState({ coach: -1 }),
openHelp: () => this.setState({ coach: 0 })
};
}
}
</script>
</body>
</html>
