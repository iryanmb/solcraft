<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Solcraft room on phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&amp;display=swap">
<style>
body{margin:0}
a{color:#FFC23A}a:hover{color:#FFD873}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #FFD873;outline-offset:2px}
input::placeholder{color:#8F8CA8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1024; color: #F5F0E6; font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 52px 22px 0; display: flex; flex-direction: column; gap: 8px">
<span style="align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #1A1410; background: #FF8F6B; padding: 4px 9px; border-radius: 9px">Words</span>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.05">Cliterati Open Mic</h1>
<div style="display: flex; align-items: center; gap: 10px; margin-top: 6px; padding: 10px 10px 10px 14px; border-radius: 18px; background: #181B36">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #B3B0C7">Next night</span><span style="font-weight: 700; font-size: 15px; color: #FFC23A">Thu, Oct 15 · 7:30 PM</span></span>
<button type="button" onClick="{{ togglePlan }}" style="{{ planStyle }}">{{ planLabel }}</button>
</div>
</div>
<div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px 22px 12px; overflow: hidden">
<div style="display: flex; gap: 8px; align-items: center; padding: 6px 6px 6px 14px; border-radius: 22px; border: 1.5px solid #3A3F6E">
<label for="m-compose" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Say something to the room</label>
<input id="m-compose" type="text" placeholder="Say something to the room…" style="flex: 1; min-width: 0; height: 40px; border: none; background: transparent; color: #F5F0E6; font: 400 15px 'DM Sans', sans-serif; outline: none">
<button type="button" style="height: 40px; padding: 0 16px; border-radius: 20px; border: none; background: #FFC23A; color: #1A1410; font: 700 13px 'DM Sans', sans-serif">Post</button>
</div>
<sc-for list="{{ posts }}" as="p" hint-placeholder-count="3">
<sc-if value="{{ p.isWelcome }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 18px; background: #15183A">
<svg viewBox="0 0 100 100" width="24" height="24" aria-hidden="true"><polygon points="50.0,3.9 57.6,21.7 73.9,8.6 70.4,29.6 90.9,26.4 79.3,42.2 94.8,50.0 80.0,58.0 88.7,72.3 71.7,71.7 72.4,88.8 57.5,78.0 50.0,96.6 41.6,81.5 27.4,89.1 29.1,70.9 8.7,73.8 17.9,58.6 2.6,50.0 20.6,42.1 7.2,25.3 29.7,29.7 25.6,7.7 42.2,21.1" fill="#FFC23A" stroke="#1A1410" stroke-width="5" stroke-linejoin="round"></polygon></svg>
<span style="flex: 1; font-size: 14px; font-weight: 700">{{ p.text }}</span>
<button type="button" onClick="{{ p.glow }}" aria-pressed="{{ p.glowed }}" style="{{ p.glowStyle }}"><svg viewBox="0 0 100 100" width="14" height="14" aria-hidden="true"><polygon points="50.0,3.9 57.6,21.7 73.9,8.6 70.4,29.6 90.9,26.4 79.3,42.2 94.8,50.0 80.0,58.0 88.7,72.3 71.7,71.7 72.4,88.8 57.5,78.0 50.0,96.6 41.6,81.5 27.4,89.1 29.1,70.9 8.7,73.8 17.9,58.6 2.6,50.0 20.6,42.1 7.2,25.3 29.7,29.7 25.6,7.7 42.2,21.1" fill="{{ p.glowFill }}" stroke="#FFC23A" stroke-width="6" stroke-linejoin="round"></polygon></svg>{{ p.glowLabel }}</button>
</div>
</sc-if>
<sc-if value="{{ p.isPost }}" hint-placeholder-val="{{ true }}">
<article style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 20px; background: #181B36">
<div style="display: flex; align-items: center; gap: 8px">
<span style="{{ p.avatarStyle }}">{{ p.initial }}</span>
<span style="font-weight: 700; font-size: 14px">{{ p.name }}</span>
<span style="display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 2px 8px; border-radius: 9px; background: #22264A; color: #B3B0C7"><span style="width: 7px; height: 7px; border-radius: 50%; background: #FF8F6B"></span>{{ p.standing }}</span>
<span style="margin-left: auto; font-size: 12px; color: #B3B0C7">{{ p.time }}</span>
</div>
<p style="margin: 0; font-size: 15px; line-height: 1.45">{{ p.text }}</p>
<sc-if value="{{ p.hasWork }}" hint-placeholder-val="{{ false }}">
<blockquote style="margin: 0; padding: 12px 14px; border-radius: 14px; background: #22264A; font-style: italic; font-size: 14px; line-height: 1.55; white-space: pre-line; color: #E9E4D6">{{ p.work }}</blockquote>
</sc-if>
<div style="display: flex; gap: 8px">
<button type="button" onClick="{{ p.glow }}" aria-pressed="{{ p.glowed }}" style="{{ p.glowStyle }}"><svg viewBox="0 0 100 100" width="14" height="14" aria-hidden="true"><polygon points="50.0,3.9 57.6,21.7 73.9,8.6 70.4,29.6 90.9,26.4 79.3,42.2 94.8,50.0 80.0,58.0 88.7,72.3 71.7,71.7 72.4,88.8 57.5,78.0 50.0,96.6 41.6,81.5 27.4,89.1 29.1,70.9 8.7,73.8 17.9,58.6 2.6,50.0 20.6,42.1 7.2,25.3 29.7,29.7 25.6,7.7 42.2,21.1" fill="{{ p.glowFill }}" stroke="#FFC23A" stroke-width="6" stroke-linejoin="round"></polygon></svg>{{ p.glowLabel }}</button>
<span style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1.5px solid #3A3F6E; font-size: 12px; display: flex; align-items: center; gap: 6px; box-sizing: border-box"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>{{ p.replyLabel }}</span>
</div>
</article>
</sc-if>
</sc-for>
</div>
<nav style="height: 84px; flex: none; display: flex; align-items: center; justify-content: space-around; border-top: 1px solid #22264A; background: #0E1024; padding-bottom: 12px; box-sizing: border-box">
<a href="Discover.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 56px; color: #B3B0C7; font-size: 12px; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Discover</a>
<a href="Room.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 56px; color: #F5F0E6; font-size: 12px; font-weight: 700; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"></path><path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"></path><path d="M14.5 12h.01"></path></svg>Rooms</a>
<a href="CheckIn.dc.html" aria-label="Check in" style="width: 60px; height: 60px; border-radius: 30px; background: #FFC23A; display: flex; align-items: center; justify-content: center; margin-top: -26px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1A1410" stroke-width="2.2" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path><path d="M8 12h8"></path></svg></a>
<a href="Sky.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 56px; color: #B3B0C7; font-size: 12px; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><ellipse cx="12" cy="12" rx="10" ry="4.5"></ellipse></svg>Your Sky</a>
<a href="SunRoad.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 56px; color: #B3B0C7; font-size: 12px; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 21c0-6 8-6 8-12M8 9c0-3 2-6 4-6"></path><circle cx="16" cy="9" r="2"></circle></svg>Sun Road</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const glowed = s.glowed || {};
const planned = !!s.planned;
const colors = { M: '#C9A7FF', N: '#7FB2FF' };
const raw = [
{ id: 'q1', kind: 'post', name: 'Maya', standing: '7 planets', time: '2h', text: 'Who closed the night last Thursday? The piece about her grandmother\'s kitchen. I need her name.', replies: 2 },
{ id: 'w1', kind: 'welcome', text: 'Welcome Imani. First night here.' },
{ id: 'n1', kind: 'post', name: 'Nia', standing: '9 planets', time: '1d', text: 'Draft of something I\'m reading this week. Be gentle.', work: 'my grandmother salted the rice like a promise\nshe never said out loud.\nthe pot knew. the steam knew.\nnow I know.', replies: 2 }
];
const posts = raw.map((p) => {
const g = !!glowed[p.id];
const base = {
isWelcome: p.kind === 'welcome', isPost: p.kind === 'post', text: p.text,
glowed: g, glowFill: g ? '#FFC23A' : 'none', glowLabel: g ? 'Glowed' : 'Glow',
glowStyle: 'height: 34px; padding: 0 12px; border-radius: 17px; border: 1.5px solid ' + (g ? '#FFC23A' : '#3A3F6E') + '; background: ' + (g ? '#2A211B' : 'transparent') + '; color: ' + (g ? '#FFD873' : '#F5F0E6') + '; font: 500 12px \'DM Sans\', sans-serif; display: flex; align-items: center; gap: 6px;',
glow: () => this.setState({ glowed: Object.assign({}, glowed, { [p.id]: !g }) })
};
if (p.kind === 'welcome') return base;
return Object.assign(base, {
name: p.name, initial: p.name[0], standing: p.standing, time: p.time,
avatarStyle: 'width: 30px; height: 30px; flex: none; border-radius: 50%; background: ' + colors[p.name[0]] + '; color: #1A1410; display: flex; align-items: center; justify-content: center; font-family: \'Bricolage Grotesque\', sans-serif; font-weight: 800; font-size: 13px;',
hasWork: !!p.work, work: p.work || '', replyLabel: p.replies + ' replies'
});
});
return {
posts,
planLabel: planned ? 'Planned' : 'Plan it',
planStyle: 'height: 40px; padding: 0 16px; border-radius: 20px; font: 700 13px \'DM Sans\', sans-serif; ' + (planned ? 'border: 1.5px solid #FFC23A; background: #2A211B; color: #FFD873;' : 'border: none; background: #FFC23A; color: #1A1410;'),
togglePlan: () => this.setState({ planned: !planned })
};
}
}
</script>
</body>
</html>
