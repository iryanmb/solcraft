<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Solcraft settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&amp;display=swap">
<style>
body{margin:0;background:#0E1024}
a{color:#FFC23A}a:hover{color:#FFD873}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #FFD873;outline-offset:2px}
input::placeholder{color:#8F8CA8}

</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: #0E1024; color: #F5F0E6; font-family: 'DM Sans', sans-serif; display: flex; flex-wrap: wrap">
<aside style="flex: 1 1 220px; max-width: 100%; box-sizing: border-box; padding: 32px 24px; border-right: 1px solid #22264A; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; align-items: center; gap: 10px">
<svg viewBox="0 0 100 100" width="36" height="36" aria-hidden="true"><polygon points="50.0,3.9 57.6,21.7 73.9,8.6 70.4,29.6 90.9,26.4 79.3,42.2 94.8,50.0 80.0,58.0 88.7,72.3 71.7,71.7 72.4,88.8 57.5,78.0 50.0,96.6 41.6,81.5 27.4,89.1 29.1,70.9 8.7,73.8 17.9,58.6 2.6,50.0 20.6,42.1 7.2,25.3 29.7,29.7 25.6,7.7 42.2,21.1" fill="#FFC23A" stroke="#1A1410" stroke-width="4" stroke-linejoin="round"></polygon><circle cx="42" cy="44" r="3.5" fill="#1A1410"></circle><circle cx="58" cy="44" r="3.5" fill="#1A1410"></circle><path d="M38 55 Q50 66 62 55" fill="none" stroke="#1A1410" stroke-width="4" stroke-linecap="round"></path></svg>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px">Solcraft</span>
</div>
<nav style="display: flex; flex-direction: column; gap: 4px">
<a href="WebDiscover.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; color: #B3B0C7; font-size: 15px; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Discover</a>
<a href="WebRooms.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; color: #B3B0C7; font-size: 15px; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"></path><path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"></path><path d="M14.5 12h.01"></path></svg>Rooms</a>
<a href="WebSky.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; color: #B3B0C7; font-size: 15px; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><ellipse cx="12" cy="12" rx="10" ry="4.5"></ellipse></svg>Your Sky</a>
<a href="WebSunRoad.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; color: #B3B0C7; font-size: 15px; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 21c0-6 8-6 8-12M8 9c0-3 2-6 4-6"></path><circle cx="16" cy="9" r="2"></circle></svg>Sun Road</a>
</nav>
<a href="WebProfile.dc.html" aria-current="page" style="margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: #181B36; color: #F5F0E6; font-weight: 700; font-size: 15px; text-decoration: none"><span style="width: 32px; height: 32px; border-radius: 16px; background: #2A211B; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 100 100" width="24" height="24" aria-hidden="true"><polygon points="50.0,3.9 57.6,21.7 73.9,8.6 70.4,29.6 90.9,26.4 79.3,42.2 94.8,50.0 80.0,58.0 88.7,72.3 71.7,71.7 72.4,88.8 57.5,78.0 50.0,96.6 41.6,81.5 27.4,89.1 29.1,70.9 8.7,73.8 17.9,58.6 2.6,50.0 20.6,42.1 7.2,25.3 29.7,29.7 25.6,7.7 42.2,21.1" fill="#FFC23A" stroke="#1A1410" stroke-width="5" stroke-linejoin="round"></polygon></svg></span>Ryan</a>
</aside>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 36px 40px 48px">
<div style="max-width: 1000px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 14px">
<a href="WebProfile.dc.html" style="align-self: flex-start; display: flex; align-items: center; gap: 6px; font-size: 14px; color: #B3B0C7; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Profile</a>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; line-height: 1">Settings</h1>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<nav aria-label="Settings sections" style="flex: 1 1 240px; max-width: 300px; border-radius: 20px; background: #181B36; overflow: hidden; display: flex; flex-direction: column">
<sc-for list="{{ cats }}" as="c" hint-placeholder-count="5"><button type="button" onClick="{{ c.pick }}" aria-current="{{ c.cur }}" style="{{ c.style }}"><span style="flex: 1; text-align: left">{{ c.label }}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E6B88" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button></sc-for>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #22264A">
<button type="button" style="height: 46px; border-radius: 23px; border: 1.5px solid #3A3F6E; background: transparent; color: #F5F0E6; font: 700 15px 'DM Sans', sans-serif; cursor: pointer">Sign out</button>
</div>
</nav>
<section aria-label="{{ title }}" style="flex: 2 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0 0 4px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px">{{ title }}</h2>
<div style="border-radius: 20px; background: #181B36; overflow: hidden; display: flex; flex-direction: column">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
<div style="{{ r.rowStyle }}">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px" id="{{ r.id }}">{{ r.label }}</span><sc-if value="{{ r.hasHint }}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; color: #B3B0C7">{{ r.hint }}</span></sc-if></span>
<sc-if value="{{ r.isLink }}" hint-placeholder-val="{{ true }}"><span style="display: flex; align-items: center; gap: 10px; font-size: 15px; color: #B3B0C7">{{ r.value }}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E6B88" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span></sc-if>
<sc-if value="{{ r.isToggle }}" hint-placeholder-val="{{ false }}"><button type="button" role="switch" aria-checked="{{ r.on }}" aria-labelledby="{{ r.id }}" onClick="{{ r.flip }}" style="{{ r.track }}"><span style="{{ r.knob }}"></span></button></sc-if>
<sc-if value="{{ r.isChannels }}" hint-placeholder-val="{{ false }}"><span style="display: flex; gap: 8px"><sc-for list="{{ r.chans }}" as="h" hint-placeholder-count="2"><button type="button" aria-pressed="{{ h.on }}" onClick="{{ h.flip }}" style="{{ h.style }}">{{ h.label }}</button></sc-for></span></sc-if>
<sc-if value="{{ r.isDanger }}" hint-placeholder-val="{{ false }}"><button type="button" style="height: 40px; padding: 0 18px; border-radius: 20px; border: 1.5px solid #6B2A22; background: transparent; color: #FF8F7A; font: 700 14px 'DM Sans', sans-serif; cursor: pointer">Delete</button></sc-if>
</div>
</sc-for>
</div>
</section>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const cat = s.cat || 'notifications';
const on = Object.assign({ priv: true }, s.on || {});
const ch = Object.assign({ replies: ['push'], glows: [], followers: ['push'], cancel: ['push', 'email'], remind: ['push', 'email'], news: ['email'] }, s.ch || {});
const order = [['account', 'Account'], ['privacy', 'Privacy'], ['notifications', 'Notifications'], ['support', 'Support']];
const cats = order.map(([k, label], i) => ({ label, cur: cat === k ? 'page' : 'false', pick: () => this.setState({ cat: k }),
style: 'display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 20px; border: none; cursor: pointer; font: ' + (cat === k ? '700' : '500') + ' 16px \'DM Sans\', sans-serif; color: ' + (cat === k ? '#F5F0E6' : '#B3B0C7') + '; background: ' + (cat === k ? '#22264A' : 'transparent') + ';' + (i ? ' border-top: 1px solid #22264A;' : '') }));
let i = 0;
const base = () => 'display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 10px 20px; box-sizing: border-box;' + (i++ ? ' border-top: 1px solid #22264A;' : '');
const link = (label, value, hint) => ({ rowStyle: base(), label, value: value || '', hint: hint || '', hasHint: !!hint, isLink: true, id: 'r' + i });
const tog = (key, label, hint) => { const v = !!on[key]; return { rowStyle: base(), label, hint: hint || '', hasHint: !!hint, isToggle: true, id: 'set-' + key, on: v,
flip: () => this.setState({ on: Object.assign({}, on, { [key]: !v }) }),
track: 'flex: none; width: 52px; height: 32px; border-radius: 16px; border: none; padding: 3px; box-sizing: border-box; cursor: pointer; display: flex; justify-content: ' + (v ? 'flex-end' : 'flex-start') + '; background: ' + (v ? '#FFC23A' : '#3A3F6E') + ';',
knob: 'width: 26px; height: 26px; border-radius: 13px; background: ' + (v ? '#1A1410' : '#F5F0E6') + ';' }; };
const chans = (key, label, hint) => ({ rowStyle: base(), label, hint: hint || '', hasHint: !!hint, isChannels: true, id: 'n-' + key,
chans: [['push', 'Push'], ['email', 'Email']].map(([c, cl]) => { const v = ch[key].indexOf(c) >= 0; return { label: cl, on: v,
flip: () => this.setState({ ch: Object.assign({}, ch, { [key]: v ? ch[key].filter((x) => x !== c) : ch[key].concat([c]) }) }),
style: 'height: 36px; padding: 0 14px; border-radius: 18px; cursor: pointer; font: ' + (v ? '700' : '500') + ' 13px \'DM Sans\', sans-serif; border: 1.5px solid ' + (v ? '#FFC23A' : '#3A3F6E') + '; background: ' + (v ? '#FFC23A' : 'transparent') + '; color: ' + (v ? '#1A1410' : '#B3B0C7') + ';' }; }) });
const danger = (label) => ({ rowStyle: base(), label, isDanger: true, id: 'r' + i });
const pages = {
account: () => [link('Photo', 'Sun icon'), link('Name', 'Ryan'), link('Email', 'ryan@[email]'), link('Birthday', 'Aug 14, 2004'), link('Instagram', '@ryan', 'Only approved followers see it')],
privacy: () => [tog('priv', 'Private profile', 'Approve who follows you'), link('Follow requests', '2'), link('Blocked', '')],
notifications: () => [chans('replies', 'Replies'), chans('glows', 'Glows'), chans('followers', 'Followers and requests'), chans('cancel', 'Cancellations', 'At places you follow'), chans('remind', 'Reminders', 'On nights you planned'), chans('news', 'From Solcraft', 'New features and ways to help')],
support: () => [link('Share an idea or bug'), link('Community guidelines'), link('Help'), link('Terms'), link('Privacy policy'), danger('Delete account')]
};
const rows = pages[cat]().map((r) => Object.assign({ isLink: false, isToggle: false, isChannels: false, isDanger: false, chans: [] }, r));
return { cats, rows, title: order.find((o) => o[0] === cat)[1] };
}
}
</script>
</body>
</html>
